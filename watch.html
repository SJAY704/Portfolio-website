<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch — CHUKS MOVIES</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:      '#07070e',
            surface: '#0f0f1a',
            card:    '#161625',
            accent:  '#f0a500',
            muted:   '#7777aa',
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'cursive'],
            body:    ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .player-wrapper::before {
      content: '';
      display: block;
      padding-top: 56.25%; /* 16:9 */
    }
    .player-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .player-wrapper .player-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #07070e;
      gap: 16px;
      z-index: 2;
      transition: opacity 0.4s;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(240,165,0,0.2);
      border-top-color: #f0a500;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .source-btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #ccc;
      font-family: 'Outfit', sans-serif;
    }
    .source-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .source-btn.active {
      background: rgba(240,165,0,0.15);
      border-color: rgba(240,165,0,0.5);
      color: #f0a500;
    }

    .ep-btn {
      min-width: 44px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.06);
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      font-family: 'Outfit', sans-serif;
    }
    .ep-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .ep-btn.active {
      background: #f0a500;
      color: #07070e;
      border-color: #f0a500;
    }

    .season-tab {
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.06);
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
    }
    .season-tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .season-tab.active {
      background: rgba(240,165,0,0.15);
      border-color: rgba(240,165,0,0.4);
      color: #f0a500;
    }

    .ep-scroll { scrollbar-width: thin; scrollbar-color: var(--accent) var(--surface); }
    .ep-scroll::-webkit-scrollbar { height: 4px; }
    .ep-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
  </style>
</head>

<body class="min-h-screen bg-bg">

  <!-- NAVBAR -->
  <nav id="mainNav" class="nav-glass fixed top-0 left-0 right-0 z-50 px-4 md:px-8 py-3 transition-shadow duration-300">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-8 h-8 bg-accent rounded flex items-center justify-center group-hover:scale-110 transition-transform">
          <svg class="w-5 h-5 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/>
          </svg>
        </div>
        <span class="font-display text-2xl tracking-widest text-accent leading-none">CHUKS MOVIES</span>
      </a>
      <div class="hidden md:flex items-center gap-8">
        <a href="index.html" class="text-gray-400 hover:text-white transition text-sm uppercase tracking-widest">Home</a>
        <a href="search.html?type=movie" class="text-gray-400 hover:text-white transition text-sm uppercase tracking-widest">Movies</a>
        <a href="search.html?type=tv" class="text-gray-400 hover:text-white transition text-sm uppercase tracking-widest">TV Shows</a>
      </div>
      <div class="flex items-center gap-2">
        <a href="search.html" class="p-2 rounded-full hover:bg-white/10 transition text-gray-400 hover:text-white" title="Search">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </a>
        <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-full hover:bg-white/10 transition text-gray-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="mobileMenu" class="hidden md:hidden mt-2 pb-3 border-t border-white/5">
      <div class="flex flex-col pt-3 px-2 gap-1">
        <a href="index.html"             class="text-gray-300 py-2 px-4 rounded-lg hover:bg-white/5 text-sm">Home</a>
        <a href="search.html?type=movie" class="text-gray-300 py-2 px-4 rounded-lg hover:bg-white/5 text-sm">Movies</a>
        <a href="search.html?type=tv"    class="text-gray-300 py-2 px-4 rounded-lg hover:bg-white/5 text-sm">TV Shows</a>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="pt-16 min-h-screen">

    <!-- Loading state -->
    <div id="pageLoading" class="flex items-center justify-center" style="min-height: calc(100vh - 64px);">
      <div class="text-center">
        <div class="spinner mx-auto mb-4"></div>
        <p class="text-muted text-sm">Loading player…</p>
      </div>
    </div>

    <!-- Watch page content -->
    <div id="watchContent" class="hidden">

      <!-- Backdrop blur background -->
      <div id="watchBg" class="fixed inset-0 bg-cover bg-center opacity-10 pointer-events-none" style="filter: blur(60px); z-index: 0;"></div>

      <div class="relative z-10 max-w-7xl mx-auto px-4 md:px-6 py-6">

        <!-- Back + breadcrumb -->
        <div class="flex items-center gap-3 mb-5">
          <a href="javascript:history.back()" class="inline-flex items-center gap-1.5 text-sm text-gray-400 hover:text-white transition group">
            <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back
          </a>
          <span class="text-gray-600">/</span>
          <span id="breadcrumbTitle" class="text-gray-400 text-sm truncate max-w-xs"></span>
        </div>

        <!-- Layout: player + sidebar -->
        <div class="flex flex-col xl:flex-row gap-6">

          <!-- LEFT: Player column -->
          <div class="flex-1 min-w-0">

            <!-- Player -->
            <div class="player-wrapper shadow-2xl mb-4">
              <div class="player-loading" id="playerLoading">
                <div class="spinner"></div>
                <p class="text-gray-400 text-sm">Connecting to stream…</p>
              </div>
              <iframe
                id="playerFrame"
                allowfullscreen
                allow="autoplay; fullscreen; picture-in-picture"
                referrerpolicy="no-referrer"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
                title="Video Player"
              ></iframe>
            </div>

            <!-- Now Playing label -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <h1 id="playerTitle" class="font-display text-2xl md:text-3xl text-white leading-none"></h1>
                <p id="playerSubtitle" class="text-muted text-sm mt-1"></p>
              </div>
              <a id="detailLink" href="#" class="text-xs text-accent hover:text-yellow-300 transition flex items-center gap-1 flex-shrink-0">
                View Details
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
              </a>
            </div>

            <!-- Source switcher -->
            <div class="bg-surface rounded-xl p-4 mb-5 border border-white/5">
              <p class="text-xs text-muted uppercase tracking-widest mb-3 font-semibold">Stream Source — If one doesn't load, try another</p>
              <div id="sourceBtns" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- TV Season / Episode selector (hidden for movies) -->
            <div id="tvControls" class="hidden bg-surface rounded-xl border border-white/5 overflow-hidden mb-5">

              <!-- Season tabs -->
              <div class="border-b border-white/5 px-4 py-3">
                <p class="text-xs text-muted uppercase tracking-widest mb-3 font-semibold">Season</p>
                <div id="seasonTabs" class="flex gap-2 overflow-x-auto ep-scroll pb-1"></div>
              </div>

              <!-- Episode grid -->
              <div class="px-4 py-4">
                <div class="flex items-center justify-between mb-3">
                  <p class="text-xs text-muted uppercase tracking-widest font-semibold">Episodes</p>
                  <span id="epCount" class="text-xs text-muted"></span>
                </div>
                <div id="episodeGrid" class="flex flex-wrap gap-2 max-h-52 overflow-y-auto ep-scroll pr-1"></div>
              </div>
            </div>

          </div>

          <!-- RIGHT: Info sidebar -->
          <div id="infoSidebar" class="xl:w-80 flex-shrink-0">

            <!-- Poster + info card -->
            <div class="bg-surface rounded-xl border border-white/5 overflow-hidden mb-4 fade-in">
              <div class="flex xl:flex-col gap-4 p-4">
                <img id="sidebarPoster" src="" alt=""
                  class="w-24 xl:w-full rounded-lg object-cover flex-shrink-0"
                  style="xl:aspect-ratio:2/3; aspect-ratio:2/3; max-height: 220px; object-position: top;"
                  onerror="this.style.display='none'"
                />
                <div class="flex-1">
                  <div class="flex flex-wrap gap-1.5 mb-2" id="sidebarBadges"></div>
                  <h2 id="sidebarTitle" class="font-display text-xl text-white leading-tight mb-1"></h2>
                  <p id="sidebarMeta" class="text-muted text-xs mb-3"></p>
                  <p id="sidebarOverview" class="text-gray-400 text-xs leading-relaxed line-clamp-4 xl:line-clamp-6"></p>
                </div>
              </div>
              <div class="border-t border-white/5 px-4 py-3 flex flex-wrap gap-3">
                <a id="sidebarDownload" href="#" target="_blank"
                   class="flex-1 inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold px-3 py-2.5 rounded-lg text-xs uppercase tracking-wide transition-all hover:scale-105">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                  </svg>
                  Download
                </a>
                <a id="sidebarDetail" href="#"
                   class="flex-1 inline-flex items-center justify-center gap-2 bg-white/8 hover:bg-white/15 text-white font-semibold px-3 py-2.5 rounded-lg text-xs uppercase tracking-wide border border-white/10 transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  Details
                </a>
              </div>
            </div>

            <!-- Similar titles -->
            <div id="similarSection" class="hidden fade-in">
              <h3 class="font-display text-lg text-white mb-3">UP NEXT</h3>
              <div id="similarList" class="space-y-3"></div>
            </div>

          </div>

        </div>
      </div>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/watch.js"></script>
</body>
</html>
